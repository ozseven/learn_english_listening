version: '3.8'

services:
  app:
    build: .
    container_name: learnenglish_app
    ports:
      - "1212:80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: learnenglish_backend
    ports:
      - "5000:5000"
    restart: unless-stopped

